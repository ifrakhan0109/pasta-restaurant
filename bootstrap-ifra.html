<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  .navbar-brand span {
        font-weight: 700;
        letter-spacing: 1px;
    }

    /* 2. Slider Height Control (The most important part!) */
    .carousel-inner {
        height: 400px;
        background-color: #eee;
    }

    .carousel-item img {
        height: 400px;
        object-fit: cover; /* This stops the 'Giant Image' look */
    }

    /* 3. Dark Mode Colors */
    body.bg-dark {
        background-color: #121212 !important;
        color: white !important;
    }

    /* 4. Accordion brand color */
    .accordion-button:not(.collapsed) {
        background-color: #fff3e0; 
        color: #e65100; 
    }
    </style>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<body>
  <nav class="navbar navbar-expand-lg bg-warning sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="./pastalogo.png" alt="Logo" height="50" class="me-2">
                <span style="font-family: 'Playfair Display', serif; font-weight: bold; color: red;">Pasta Shasta</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link text-dark" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-dark" href="#menu">Menu</a></li>
                    <li class="nav-item"><a class="nav-link text-dark" href="#contact">Contact</a></li>
                    <li class="nav-item ms-lg-3">
                        <button id="darkModeToggle" class="btn btn-outline-dark btn-sm">🌙 Mode</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4"> 
        <div id="pastaCarousel" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#pastaCarousel" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#pastaCarousel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#pastaCarousel" data-bs-slide-to="2"></button>
            </div>
            <div class="carousel-inner" style="height: 400px;">
                <div class="carousel-item active">
                    <img src="./pasta1.jpeg.png" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Pasta 1">
                </div>
                <div class="carousel-item">
                    <img src="./pasta2.jpeg.png" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Pasta 2">
                </div>
                <div class="carousel-item">
                    <img src="./pasta3.jpeg.png" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Pasta 3">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#pastaCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#pastaCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>

    <div class="container my-5" id="faqSection">
        <h2 class="text-center mb-4" style="font-family: 'Playfair Display', serif;">Frequently Asked Questions</h2>
        <div class="accordion shadow" id="accordionPasta">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne">
                        <strong>Where do you deliver in Karachi?</strong>
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionPasta">
                    <div class="accordion-body">
                        We currently deliver to DHA, Clifton, and PECHS. For other areas, please message us on WhatsApp!
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo">
                        <strong>How fresh is the pasta?</strong>
                    </button>
                </h2>
                <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionPasta">
                    <div class="accordion-body">
                        Every bowl is made to order to ensure the best texture.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        $(document).ready(function(){
            $("#darkModeToggle").click(function(){
                $("body").toggleClass("bg-dark text-white");
                $(this).text($(this).text() == "🌙 Mode" ? "☀️ Light" : "🌙 Mode");
            });
        });
    </script>
    
</body>
</html>
